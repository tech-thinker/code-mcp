services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
    container_name: code-mcp
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Every subfolder of ./projects becomes one reference project.
      # Mounted read-only; the folder name is the project name.
      - ./projects:/app/projects:ro
    ports:
      - "8000:8000"
